# ==============================================================================
# Production Configuration Profile (active when --spring.profiles.active=prod)
# ==============================================================================
# Strict Zero-Default Security Policy:
# Real secrets and credentials MUST be provided through environment variables.
# The application will refuse to start if default development credentials are used.
# ==============================================================================

# Database Configuration (External Production MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production JWT Security Configuration (No default secret permitted)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# EV Business Logic Parameters
app.geofence.max-radius-km=30.0
app.payment.demo-token-amount=150.00

# Strict Disable for Demo Data Seeding and H2 Console in Production
app.seed-demo-data=false
spring.h2.console.enabled=false
