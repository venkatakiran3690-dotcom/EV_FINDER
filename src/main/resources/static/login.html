<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart EV Charging System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-ev-station-fill text-success fs-3 me-2"></i>
                <span>Smart EV Infrastructure</span>
            </a>
            <a href="/index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <div class="text-center mb-4">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
                            <i class="bi bi-shield-lock fs-2"></i>
                        </div>
                        <h4 class="fw-bold">Welcome Back</h4>
                        <p class="text-muted small">Sign in to your EV System account</p>
                    </div>

                    <div id="alert-container"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="small text-muted">Don't have an account?</span>
                        <a href="/register.html" class="small fw-semibold text-decoration-none">Register as Driver</a>
                    </div>

                    <!-- Viva Demonstration 1-Click Fill -->
                    <div class="mt-4 pt-3 border-top">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="small fw-bold text-muted text-uppercase" style="font-size: 0.7rem;">Quick Demo Sign-In (1-Click Fill)</span>
                            <span class="badge bg-secondary" style="font-size: 0.65rem;">Academic Viva</span>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('driver@smartev.com', 'Driver@123')">
                                <i class="bi bi-person text-success me-2"></i> <strong>EV Driver:</strong> driver@smartev.com
                            </button>
                            <button class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('tatapower@smartev.com', 'Tata@123')">
                                <i class="bi bi-building text-primary me-2"></i> <strong>Company Admin (Tata Power):</strong> tatapower@smartev.com
                            </button>
                            <button class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('zeon@smartev.com', 'Zeon@123')">
                                <i class="bi bi-building-gear text-info me-2"></i> <strong>Company Admin (Zeon):</strong> zeon@smartev.com
                            </button>
                            <button class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('manager.bangalore@smartev.com', 'Manager@123')">
                                <i class="bi bi-person-gear text-warning me-2"></i> <strong>Station Manager:</strong> manager.bangalore@smartev.com
                            </button>
                            <button class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('admin@smartev.com', 'Admin@123')">
                                <i class="bi bi-shield-shaded text-danger me-2"></i> <strong>Platform Admin:</strong> admin@smartev.com
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        function fillCreds(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating...`;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                // Store JWT token and user profile
                auth.setSession(response.token, {
                    id: response.userId,
                    email: response.email,
                    fullName: response.fullName,
                    role: response.role,
                    companyId: response.companyId
                });

                showAlert('Login successful! Redirecting to dashboard...', 'success');
                setTimeout(() => {
                    auth.redirectDashboard(response.role);
                }, 800);
            } catch (err) {
                showAlert(err.message || 'Login failed. Please verify credentials.', 'danger');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Sign In`;
            }
        });
    </script>
</body>
</html>
